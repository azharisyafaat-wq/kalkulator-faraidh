name: Uji
on:
  push:
  pull_request:
jobs:
  uji:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Mesin hitung (kasus baku dan bank contoh)
        run: node uji/periksa-mesin.cjs
      - name: Pembaca cerita keluarga
        run: node uji/periksa-cerita.cjs
      - name: Sintaks service worker dan skrip terbit
        run: node --check sw.js && node --check terbit/buat-paket.cjs
